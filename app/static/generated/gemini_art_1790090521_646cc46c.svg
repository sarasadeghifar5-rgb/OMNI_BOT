<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFECB3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="catBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="catLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCC80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4037;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E1F5FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B3E5FC;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" />
  
  <!-- Window -->
  <rect x="150" y="100" width="724" height="450" rx="40" fill="url(#windowGrad)" filter="url(#softShadow)" />
  <rect x="502" y="100" width="20" height="450" fill="#FFFFFF" opacity="0.5" />
  <rect x="150" y="315" width="724" height="20" fill="#FFFFFF" opacity="0.5" />

  <!-- Table -->
  <ellipse cx="512" cy="950" rx="550" ry="250" fill="url(#tableGrad)" filter="url(#softShadow)" />

  <!-- Cat Body -->
  <path d="M350 850 Q350 550 512 550 Q674 550 674 850" fill="url(#catBodyGrad)" filter="url(#softShadow)" />
  
  <!-- Cat Tail -->
  <path d="M674 800 C750 800 800 700 780 650 C760 600 700 620 710 680" fill="none" stroke="url(#catBodyGrad)" stroke-width="60" stroke-linecap="round" filter="url(#softShadow)" />

  <!-- Cat Head -->
  <circle cx="512" cy="500" r="140" fill="url(#catBodyGrad)" filter="url(#softShadow)" />
  
  <!-- Ears -->
  <path d="M400 420 L360 300 L480 380 Z" fill="#F57C00" />
  <path d="M624 420 L664 300 L544 380 Z" fill="#F57C00" />
  <path d="M410 410 L385 325 L465 385 Z" fill="#FFAB91" />
  <path d="M614 410 L639 325 L559 385 Z" fill="#FFAB91" />

  <!-- Face Details -->
  <!-- Eyes -->
  <circle cx="450" cy="480" r="25" fill="#212121" />
  <circle cx="574" cy="480" r="25" fill="#212121" />
  <circle cx="440" cy="470" r="8" fill="white" />
  <circle cx="564" cy="470" r="8" fill="white" />
  
  <!-- Nose and Mouth -->
  <path d="M512 510 Q512 530 500 530 M512 510 Q512 530 524 530" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" />
  <path d="M500 510 L524 510 L512 522 Z" fill="#FF8A80" />

  <!-- Cheeks -->
  <circle cx="420" cy="520" r="15" fill="#FFAB91" opacity="0.4" />
  <circle cx="604" cy="520" r="15" fill="#FFAB91" opacity="0.4" />

  <!-- Paws -->
  <rect x="420" y="780" width="60" height="40" rx="20" fill="url(#catLightGrad)" />
  <rect x="544" y="780" width="60" height="40" rx="20" fill="url(#catLightGrad)" />

  <!-- Tea Cup -->
  <path d="M440 750 L584 750 C584 820 440 820 440 750" fill="#FFFFFF" filter="url(#softShadow)" />
  <path d="M584 765 C610 765 610 800 584 800" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  
  <!-- Tea Liquid -->
  <path d="M455 760 L569 760 C569 790 455 790 455 760" fill="#D7CCC8" />

  <!-- Steam -->
  <g opacity="0.6">
    <path d="M480 720 Q490 700 480 680" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" values="M480 720 Q490 700 480 680;M480 720 Q470 700 480 680;M480 720 Q490 700 480 680" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M512 710 Q522 690 512 670" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" values="M512 710 Q522 690 512 670;M512 710 Q502 690 512 670;M512 710 Q522 690 512 670" dur="2.5s" repeatCount="indefinite" />
    </path>
    <path d="M544 720 Q554 700 544 680" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" values="M544 720 Q554 700 544 680;M544 720 Q534 700 544 680;M544 720 Q554 700 544 680" dur="3.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Decorative Elements -->
  <!-- Floating Particles -->
  <circle cx="200" cy="200" r="10" fill="#FFFFFF" opacity="0.3" />
  <circle cx="850" cy="150" r="15" fill="#FFFFFF" opacity="0.2" />
  <circle cx="100" cy="800" r="8" fill="#FFFFFF" opacity="0.4" />
  <circle cx="900" cy="700" r="12" fill="#FFFFFF" opacity="0.2" />

  <!-- Table Shine -->
  <ellipse cx="512" cy="880" rx="400" ry="20" fill="#FFFFFF" opacity="0.1" />
</svg>