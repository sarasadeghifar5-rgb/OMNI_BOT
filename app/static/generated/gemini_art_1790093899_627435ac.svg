<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(80, 70%, 12%);" />
      <stop offset="50%" style="stop-color:hsl(155, 60%, 18%);" />
      <stop offset="100%" style="stop-color:hsl(260, 80%, 10%);" />
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4E80EE;" />
      <stop offset="45%" style="stop-color:#9B72CF;" />
      <stop offset="100%" style="stop-color:#E97A7A;" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:hsl(155, 90%, 65%); stop-opacity:0.8;" />
      <stop offset="60%" style="stop-color:hsl(80, 80%, 50%); stop-opacity:0.2;" />
      <stop offset="100%" style="stop-color:transparent; stop-opacity:0;" />
    </radialGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrad)" />
  <circle cx="512" cy="460" r="320" fill="url(#glowGrad)" filter="url(#neonBlur)" />

  <g transform="translate(512, 460)">
    <path d="M 0,-180 Q 50,0 200,0 Q 50,0 0,180 Q -50,0 -200,0 Q -50,0 0,-180 Z" fill="url(#geminiGrad)" opacity="0.95" filter="url(#neonBlur)" />
    <circle cx="0" cy="0" r="45" fill="#ffffff" opacity="0.9" />
  </g>

  <rect x="120" y="820" width="784" height="90" rx="24" fill="#000000" fill-opacity="0.4" stroke="url(#geminiGrad)" stroke-width="2" />
  <text x="512" y="875" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">🎨 مردم در تهران</text>
  <text x="512" y="940" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9B72CF" text-anchor="middle">Google Gemini Intelligent Visual Engine</text>
</svg>