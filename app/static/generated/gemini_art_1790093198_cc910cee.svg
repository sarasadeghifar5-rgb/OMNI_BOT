<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0118;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A0B3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#311B92;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A148C;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A237E;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3949AB;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="hill3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006064;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#00ACC1;stop-opacity:0.7" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#4285F4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4285F4;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="geminiCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8AB4F8;stop-opacity:0" />
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#skyGrad)" />

  <!-- Distant Stars -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="100" cy="150" r="1.5" />
    <circle cx="300" cy="80" r="1" />
    <circle cx="550" cy="200" r="2" />
    <circle cx="800" cy="120" r="1.2" />
    <circle cx="920" cy="300" r="1.5" />
    <circle cx="150" cy="400" r="1" />
    <circle cx="450" cy="50" r="1.8" />
    <circle cx="700" cy="350" r="1" />
  </g>

  <!-- Central Ethereal Sun -->
  <circle cx="512" cy="400" r="300" fill="url(#sunGlow)" filter="url(#blur)" />
  
  <!-- Gemini Sparkle Icon -->
  <g transform="translate(512, 400) scale(1.5)">
    <path d="M0 -80 C10 -30 30 -10 80 0 C30 10 10 30 0 80 C-10 30 -30 10 -80 0 C-30 -10 -10 -30 0 -80" fill="white" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
    </path>
    <circle r="15" fill="url(#geminiCore)" />
  </g>

  <!-- Floating Glassy Orbs -->
  <circle cx="200" cy="300" r="40" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <circle cx="850" cy="450" r="60" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <circle cx="750" cy="150" r="25" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Layered Landscape (Hills/Waves) -->
  <path d="M0 1024 V700 C200 600 400 850 600 750 C800 650 1024 800 1024 800 V1024 H0Z" fill="url(#hill1)" filter="url(#softGlow)" />
  <path d="M0 1024 V800 C300 700 500 950 750 800 C900 700 1024 850 1024 850 V1024 H0Z" fill="url(#hill2)" />
  <path d="M0 1024 V900 C250 850 450 1000 700 900 C850 850 1024 950 1024 950 V1024 H0Z" fill="url(#hill3)" opacity="0.6" />

  <!-- Energy Ribbons -->
  <path d="M-50 850 Q250 700 512 850 T1074 850" fill="none" stroke="#8AB4F8" stroke-width="2" opacity="0.3" />
  <path d="M-50 880 Q250 730 512 880 T1074 880" fill="none" stroke="#C58AF9" stroke-width="2" opacity="0.3" />

  <!-- Foreground Particles -->
  <g fill="white" opacity="0.6">
    <circle cx="480" cy="820" r="3">
        <animate attributeName="cy" values="820;800;820" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="540" cy="860" r="2">
        <animate attributeName="cy" values="860;840;860" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="900" r="1.5" />
    <circle cx="700" cy="880" r="2.5" />
  </g>

  <!-- Bottom Vignette -->
  <rect width="1024" height="300" y="724" fill="url(#bottomFade)" opacity="0.4" />
  <defs>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.8" />
    </linearGradient>
  </defs>
</svg>